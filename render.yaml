services:
  # ---------------------------------------------------------------------------
  # Unified Web Service (Backend FastAPI + Built Frontend)
  # ---------------------------------------------------------------------------
  - type: web
    name: silentwatch
    env: python
    region: oregon
    plan: free
    buildCommand: "./render-build.sh"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.x
      - key: APP_ENV
        value: production
      - key: ADMIN_BOOTSTRAP_USER
        value: admin
      - key: ADMIN_BOOTSTRAP_EMAIL
        value: teamqudex@gmail.com
      - key: ADMIN_BOOTSTRAP_PASSWORD
        value: admin
      - key: ADMIN_BOOTSTRAP_NAME
        value: Coimbatore Municipal Officer
      - key: DEFAULT_RESIDENTIAL_NIGHT_LIMIT_DBA
        value: "45.0"
      - key: DEFAULT_COMMERCIAL_NIGHT_LIMIT_DBA
        value: "55.0"
      - key: DEFAULT_INDUSTRIAL_NIGHT_LIMIT_DBA
        value: "70.0"
      - key: DEFAULT_SILENCE_ZONE_NIGHT_LIMIT_DBA
        value: "40.0"
